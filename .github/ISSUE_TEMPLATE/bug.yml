name: Bug
description: A failing scenario or wrong behaviour
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens?
      description: Failing scenario / feature file, error message, steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen?
    validations:
      required: true
